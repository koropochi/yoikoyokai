<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏮 よい子の妖怪図鑑 🏮</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-container">
      <h1>🏮 よい子の妖怪図鑑 🏮</h1>
      <p>日本の妖怪たちを紹介します。各妖怪の詳細ページへリンクしています。</p>
    </div>
  </header>

<main class="main">
  <section class="main-container" id="yokai-list"></section>
  <div class="pagination" id="pagination"></div>

  <script>
    const yokaiNames = [
      "白溶裔", "瀬戸大将", "松明丸", "算盤小僧", "琴古主", "", "", "", "", "",
      "", "", "", "", "", "", "", "", "", "",
      "", "", "", "", "", "", "", "", "", "",
      "", "", "", "", "", "", "", "", "", "",
      "", "", "", "", "", "", "", "", "", "",
      "", ""
    ];

    const itemsPerPage = 20;
    const container = document.getElementById("yokai-list");
    const pagination = document.getElementById("pagination");

    // HTMLを先に生成して保存
    const allItems = yokaiNames.map((name, index) => {
      const num = index + 1;
      const yokaiName = name || `妖怪${num}`;
      const div = document.createElement("div");
      div.className = "yokai-item";
      div.innerHTML = `
        <a href="detail-yokai${num}.html">
          <img src="images/yokai${num}.png" alt="${yokaiName}">
          <p>${yokaiName}</p>
        </a>`;
      return div;
    });

    function showPage(page) {
      container.innerHTML = "";
      const start = (page - 1) * itemsPerPage;
      const end = start + itemsPerPage;

      allItems.slice(start, end).forEach(item => container.appendChild(item));

      // ページボタンを再生成
      pagination.innerHTML = "";
      const pageCount = Math.ceil(allItems.length / itemsPerPage);

      for (let i = 1; i <= pageCount; i++) {
        const btn = document.createElement("button");
        btn.textContent = i;
        btn.className = i === page ? "active" : "";
        btn.addEventListener("click", () => showPage(i));
        pagination.appendChild(btn);
      }
    }

    // 初期表示
    showPage(1);
  </script>
</main>


  <footer>
    <p>© 2025 妖怪図鑑</p>
  </footer>
</body>
</html>
