<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏮 よい子の妖怪図鑑 🏮</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-container">
      <h1>🏮 よい子の妖怪図鑑 🏮</h1>
      <p>日本の妖怪たちを紹介します。各妖怪の詳細ページへリンクしています。</p>
    </div>
  </header>

<main class="main">
  <section class="main-container" id="yokai-list"></section>

  <script>
    const yokaiNames = [
      "白溶裔", "瀬戸大将", "松明丸", "算盤小僧", "琴古主", "", "", "", "", "",
      "", "", "", "", "", "", "", "", "", "",
      "", "", "", "", "", "", "", "", "", "",
      "", "", "", "", "", "", "", "", "", "",
      "", "", "", "", "", "", "", "", "", "",
      "", ""
    ];

    const container = document.getElementById("yokai-list");

    yokaiNames.forEach((name, index) => {
      const num = index + 1;
      const yokaiName = name || `妖怪${num}`;
      const html = `
        <div class="yokai-item">
          <a href="detail-yokai${num}.html">
            <img src="images/yokai${num}.png" alt="${yokaiName}">
            <p>${yokaiName}</p>
          </a>
        </div>`;
      container.insertAdjacentHTML('beforeend', html);
    });
  </script>
</main>


  <footer>
    <p>© 2025 妖怪図鑑</p>
  </footer>
</body>
</html>
